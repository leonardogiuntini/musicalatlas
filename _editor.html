<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor Atlas</title>
<style>
:root{color-scheme:light dark;font:15px system-ui,sans-serif}
body{margin:0;display:flex;flex-direction:column;height:100vh}
.bar{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-bottom:1px solid #8886;align-items:center}
button,input{font:inherit;padding:4px 10px;cursor:pointer}
input{cursor:text}
#hlWrap{position:relative}
#menu{position:absolute;top:100%;left:0;z-index:5;background:Canvas;color:CanvasText;border:1px solid #8888;border-radius:6px;padding:4px;display:flex;flex-direction:column;min-width:130px;margin-top:2px}
#menu[hidden]{display:none}
#menu button{display:flex;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:4px 8px}
#menu button:hover{background:#8883}
.sw{width:14px;height:14px;border:1px solid #888;border-radius:3px;display:inline-block}
#ed{flex:1;overflow:auto;padding:16px 24px;outline:none;font:17px/1.55 Georgia,serif}
#ed p{margin:0 0 .8em;min-height:1.55em}
details{border-top:1px solid #8886;padding:6px 8px}
textarea{width:100%;height:150px;box-sizing:border-box;font:13px monospace}
</style>
<style id="hl"></style>
</head>
<body>
<div class="bar">
  <button onclick="nuovo()">Nuovo</button>
  <button onclick="document.getElementById('f').click()">Apri…</button>
  <input type="file" id="f" accept=".html,.htm,.txt" hidden>
  <input id="fn" value="senza-titolo.html" size="22" aria-label="Nome file">
  <button onclick="save()"><b>Salva</b></button>
  <span style="width:12px"></span>
  <button onmousedown="event.preventDefault()" onclick="cmd('bold')"><b>B</b></button>
  <button onmousedown="event.preventDefault()" onclick="cmd('italic')"><i>I</i></button>
  <button onmousedown="event.preventDefault()" onclick="cmd('underline')"><u>U</u></button>
  <span id="hlWrap">
    <button id="hlBtn" title="Evidenziatore" onmousedown="event.preventDefault()"><svg width="16" height="16" viewBox="0 0 16 16" style="vertical-align:-3px"><path d="M10.5 1.5l4 4-7 7H3.5v-4z" fill="currentColor"/><rect x="1" y="14" width="14" height="2" fill="#fd0"/></svg> &#9662;</button>
    <div id="menu" hidden></div>
  </span>
  <span id="sz" style="margin-left:auto;font-size:12px;opacity:.7"></span>
</div>
<div id="ed" contenteditable="true" spellcheck="false"></div>
<details><summary>File pulito che verrà salvato</summary><textarea id="out" readonly></textarea></details>

<script>
// Palette standard RTF / LibreOffice: nome -> RGB
const P={yellow:[255,255,0],cyan:[0,255,255],green:[0,255,0],red:[255,0,0],magenta:[255,0,255],blue:[0,0,255],white:[255,255,255]};
const ed=document.getElementById('ed'),out=document.getElementById('out');
const rgb=n=>`rgb(${P[n].join(', ')})`;
const dark=n=>{const[r,g,b]=P[n];return(r*299+g*587+b*114)/1000<100};

// CSS per mostrare gli highlight nell'editor + voci del menu
let css='';const menu=document.getElementById('menu');
function item(n){
  const b=document.createElement('button');
  b.innerHTML=`<span class="sw" style="background:${n?rgb(n):'transparent'}"></span>${n||'nessuno'}`;
  b.onmousedown=e=>e.preventDefault();
  b.onclick=()=>{hl(n);menu.hidden=true};
  menu.append(b);
}
item(null);
for(const n in P){css+=`mark.${n}{background:${rgb(n)};color:${dark(n)?'#fff':'#000'}}`;item(n)}
document.getElementById('hl').textContent=css;
document.getElementById('hlBtn').onclick=()=>{menu.hidden=!menu.hidden};
document.addEventListener('mousedown',e=>{if(!e.target.closest('#hlWrap'))menu.hidden=true});

function cmd(c){ed.focus();document.execCommand('styleWithCSS',false,true);document.execCommand(c);refresh()}
function hl(n){
  ed.focus();document.execCommand('styleWithCSS',false,true);
  document.execCommand('hiliteColor',false,n?rgb(n):'transparent');
  // solo estetica nell'editor: testo chiaro sui colori scuri (non finisce nel file)
  ed.querySelectorAll('span[style*="background"]').forEach(s=>{
    const m=s.style.backgroundColor.match(/\d+/g);
    s.style.color=m&&m.slice(0,3).join()&&Object.keys(P).some(k=>dark(k)&&P[k].join()==m.slice(0,3).join())?'#fff':'';
  });
  refresh();
}

/* ---------- ESPORTAZIONE: legge il DOM e produce solo p, b, i, u, mark, br ---------- */
function st(el,s){
  const t=el.tagName,c=el.style||{};let r={...s};
  if(t=='B'||t=='STRONG')r.b=1; if(t=='I'||t=='EM')r.i=1; if(t=='U')r.u=1;
  if(c.fontWeight)r.b=(c.fontWeight=='bold'||+c.fontWeight>=600)?1:0;
  if(c.fontStyle)r.i=c.fontStyle=='italic'?1:0;
  const d=c.textDecorationLine||c.textDecoration; if(d)r.u=d.includes('underline')?1:0;
  if(t=='MARK'&&P[el.className])r.h=el.className;
  else if(c.backgroundColor){
    const m=c.backgroundColor.match(/\d+/g);r.h=null;
    if(m&&m.length>=3&&(m[3]===undefined||+m[3]>0))for(const n in P)if(P[n].join()==m.slice(0,3).join())r.h=n;
  }
  return r;
}
function collect(){
  const paras=[];let cur=[];
  const flush=()=>{if(cur.length)paras.push(cur);cur=[]};
  (function walk(n,s){
    for(const c of n.childNodes){
      if(c.nodeType==3)cur.push({t:c.nodeValue,...s});
      else if(c.nodeType==1){
        if(c.tagName=='BR')cur.push({br:1});
        else if(/^(DIV|P)$/.test(c.tagName)){flush();walk(c,st(c,s));flush()}
        else walk(c,st(c,s));
      }
    }
  })(ed,{});
  flush();return paras;
}
const clean=t=>t.normalize('NFC').replace(/[\u200b-\u200d\u2060\ufeff]/g,'').replace(/\u00a0/g,' ');
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const key=r=>`${r.b?1:0}${r.i?1:0}${r.u?1:0}${r.h||''}`;
function wrap(r){ // ordine fisso: mark > b > i > u
  let x=esc(r.t);
  if(r.u)x=`<u>${x}</u>`; if(r.i)x=`<i>${x}</i>`; if(r.b)x=`<b>${x}</b>`;
  if(r.h)x=`<mark class="${r.h}">${x}</mark>`;
  return x;
}
function exp(){
  return collect().map(p=>{
    if(p.length&&p[p.length-1].br)p=p.slice(0,-1);   // br finale = segnaposto del browser
    const m=[];
    for(const r of p){
      if(r.br){m.push(r);continue}
      const t=clean(r.t);if(!t)continue;
      const l=m[m.length-1];
      if(l&&!l.br&&key(l)==key(r))l.t+=t;            // unisce pezzi identici adiacenti (es. GUMB+AY)
      else m.push({...r,t});
    }
    return '<p>'+m.map(r=>r.br?'<br>':wrap(r)).join('')+'</p>';
  }).join('\n')+'\n';
}

/* ---------- IMPORTAZIONE: accetta solo il formato pulito ---------- */
function imp(html){
  const d=new DOMParser().parseFromString(html,'text/html');
  ed.innerHTML='';let p=null;
  const nuovoP=()=>{p=document.createElement('p');ed.append(p);return p};
  (function build(n,tgt){
    for(const c of n.childNodes){
      if(c.nodeType==3){
        if(!tgt&&!c.nodeValue.trim())continue;
        (tgt||p||nuovoP()).append(c.nodeValue);
      }else if(c.nodeType==1){
        const t=c.tagName;
        if(t=='P'||t=='DIV'){const q=nuovoP();build(c,q);p=null}
        else if(t=='BR')(tgt||p||nuovoP()).append(document.createElement('br'));
        else if(/^(B|I|U|STRONG|EM|MARK)$/.test(t)){
          if(t=='MARK'&&!P[c.className]){build(c,tgt);continue}
          const e=document.createElement({STRONG:'b',EM:'i'}[t]||t.toLowerCase());
          if(t=='MARK')e.className=c.className;
          (tgt||p||nuovoP()).append(e);build(c,e);
        }else build(c,tgt);
      }
    }
  })(d.body,null);
  refresh();
}

/* ---------- Incolla sempre come testo puro ---------- */
ed.addEventListener('paste',e=>{
  e.preventDefault();
  const t=(e.clipboardData.getData('text/plain')||'').normalize('NFC').replace(/\r\n?/g,'\n');
  t.split('\n').forEach((l,i)=>{if(i)document.execCommand('insertParagraph');if(l)document.execCommand('insertText',false,l)});
});
ed.addEventListener('input',refresh);
document.execCommand('defaultParagraphSeparator',false,'p');

function refresh(){const x=exp();out.value=x;document.getElementById('sz').textContent=new Blob([x]).size+' byte'}
function nuovo(){if(!confirm('Cancellare il testo attuale?'))return;ed.innerHTML='<p><br></p>';document.getElementById('fn').value='senza-titolo.html';refresh()}
document.getElementById('f').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  imp(await f.text());document.getElementById('fn').value=f.name;e.target.value='';
};
async function save(){
  const name=document.getElementById('fn').value||'senza-titolo.html';
  const blob=new Blob([exp()],{type:'text/html'});
  if(window.showSaveFilePicker){
    try{const h=await showSaveFilePicker({suggestedName:name});const w=await h.createWritable();await w.write(blob);await w.close();return}
    catch(err){if(err.name=='AbortError')return}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
}

// Testo di prova con tutte le combinazioni
imp(`<p>Prova con accenti: perché, città, più, Côte d'Ivoire, Ñ, ß, «virgolette» – trattino, … e simboli © ® € °.</p>
<p><b>Grassetto</b>, <i>corsivo</i>, <u>sottolineato</u>, <b><i>grassetto corsivo</i></b>, <b><u>grassetto sottolineato</u></b>, <b><i><u>tutti e tre</u></i></b>.</p>
<p>Highlight: <mark class="yellow">giallo</mark>, <mark class="cyan"><b><i>EWE</i></b></mark>, <mark class="green"><b><i>AGBADJA</i></b></mark>, <mark class="red">rosso</mark>, <mark class="blue"><b>blu</b></mark>, <mark class="white">bianco</mark>.<br>Questa riga è dopo un a capo (shift+invio).</p>
<p></p>
<p>Sopra c'è un paragrafo vuoto.</p>`);
</script>
</body>
</html>
