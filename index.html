<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Musical Atlas</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="wrap">
    <div class="col">
      <h1 id="headerTitle">MUSICAL ATLAS</h1>

      <div class="searchRow">
        <input id="searchInput" type="search" placeholder="Search the Musical Atlas..." autocomplete="off" />
      </div>

      <!-- risultati della ricerca -->
      <div id="resultsRow" class="resultsRow" role="region" aria-label="Search results"></div>

      <!-- percorso (WORLD > AFRICA > ...) a sinistra, interruttori INSTRUMENTS / PEOPLES a destra -->
      <div class="navRow">
        <div id="crumbs" role="navigation" aria-label="Path"></div>
        <div id="specialToggles" class="specialToggles" role="toolbar" aria-label="Special toggles"></div>
      </div>

      <!-- pulsanti di sottocartelle e pagine -->
      <div id="choicesRow" class="choicesRow" role="region" aria-label="Choices"></div>

      <!-- pulsanti dell'interruttore acceso (INSTRUMENTS / PEOPLES) -->
      <div id="specialButtonsRow" class="choicesRow" role="region" aria-label="Special subfolders"></div>

      <!-- pagina -->
      <div class="contentPad">
        <div class="docFrame">
          <div id="docContent"></div>
        </div>
      </div>

      <div class="footerPad">Music for the People.
by Leo G.</div>
    </div>
  </div>

  <!-- menu a comparsa al clic su una parola -->
  <div id="hoverCard"></div>

  <script src="app.js"></script>
</body>
</html>
